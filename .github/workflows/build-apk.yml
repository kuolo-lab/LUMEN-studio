
name: Build LUMEN Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build LUMEN Studio
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download LUMEN Studio source
        uses: actions/checkout@v4
      - name: Verify checked-out project files
        run: |
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Repository directory:"
          pwd
          echo "Files at repository root:"
          ls -la
          echo "Finding package.json:"
          find . -maxdepth 4 -name package.json -print

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: npm install

      - name: Build LUMEN Studio web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Configure camera and internet permissions
        run: node scripts/patch-android.mjs

      - name: Compile Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload LUMEN Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
