
name: Build LUMEN Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build LUMEN Studio
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find project directory
        shell: bash
        run: |
          echo "Checking repository contents..."
          pwd
          ls -la

          PACKAGE=$(find . -maxdepth 5 \
            -type f -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "::error::No package.json found in the checked-out repository."
            echo "Check that package.json is committed to this branch."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project manifest: $PACKAGE"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Configure permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/patch-android.mjs

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Studio-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
